<html>
<head>
  <title>Student Registration</title>
</head>
<body>

<h2>Student Registration Form</h2> 

<form>
  Name:
  <input type="text" name="name">
  <br><br>
 
  Email:
  <input type="email"name="email">

  Password:
  <input type="password"
name="password">
  <br><br>

  Gender:
  <input type="radio"
name="gender"> Male
  <input type="radio"
name="gender">Female
  <br><br>
 
  Branch:
  <select name="branch">
    <option>Computer</option>
    <option>IT</option>
    <option>ICT</option>
    <option>Electrical</option>
</select>
<br><br>

 Hobbies:
 <input type="checkbox">Reading
 <input type="checkbox"> Sports
<br><br>

Address:
 <textarea rows="3" cols="20"></
textarea>
 <br><br>

 <input type="submit"
value="Register">
 <input type="reset"value="Clear">

</form>

</body>
</html>
